name: Weekly Price Source Crosscheck (G2)

on:
  push:
    branches: [main]
    paths:
      - 'data/weekly/**'
      - 'data/as/**'
      - 'data/verification/**'
      - 'scripts/verify-weekly-crosscheck.cjs'
      - '.github/workflows/verify-weekly-crosscheck.yml'
  pull_request:
    paths:
      - 'data/weekly/**'
      - 'data/as/**'
      - 'data/verification/**'
      - 'scripts/verify-weekly-crosscheck.cjs'
      - '.github/workflows/verify-weekly-crosscheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-w42:
    runs-on: ubuntu-latest
    steps:
      - name: Read source control
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch LAM board data for the same week
        run: |
          curl -fLsS --retry 3 \
            https://raw.githubusercontent.com/jskimlam/Weekly-Brief-Dashboard/main/data/w42-20261016.json \
            -o /tmp/lam-w42.json
      - name: Validate prices, published dates, AS decisions, and LAM consistency
        run: node scripts/verify-weekly-crosscheck.cjs --lam=/tmp/lam-w42.json --self-test
      - name: Review status warning
        run: |
          echo "Automated G2 checks are a pre-publication check, not a substitute for reviewing original private Platts/ICIS image/PDF assessments."
          echo "The source ledger intentionally marks not-yet-reviewed products as pending."
          echo "To require full human verification, rerun with --require-all-reviewed."
