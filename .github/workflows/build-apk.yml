name: Build LAM Weekly Board APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore selected app icon
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          base64 --decode android/icon_base64.txt > android/app/src/main/res/drawable/lam_icon.webp
          file android/app/src/main/res/drawable/lam_icon.webp

      - name: Restore stable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode android/debug_keystore_base64.txt > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build installable APK
        shell: bash
        run: |
          gradle -p android clean :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK signature and manifest
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee android/apk-badging.txt
          grep -q "package: name='com.lam.weeklyboard'" android/apk-badging.txt
          grep -q "application-label:'LAM Weekly Board'" android/apk-badging.txt

      - name: Prepare distributable
        shell: bash
        run: |
          mkdir -p android/dist
          cp android/app/build/outputs/apk/debug/app-debug.apk android/dist/LAM_Weekly_Board_v1.0.0.apk
          sha256sum android/dist/LAM_Weekly_Board_v1.0.0.apk > android/dist/LAM_Weekly_Board_v1.0.0.sha256
          cp android/apk-badging.txt android/dist/apk-badging.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LAM-Weekly-Board-APK
          path: android/dist/*
          if-no-files-found: error
          retention-days: 30
