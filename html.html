const SAMPLE_TEXT="제목 : WTI 종목 브리핑 (2026-08-07)\n\n가격\nWTI 9월물 (NYMEX): $78.18/b ← $84.67/b (전주 금요일 대비 -$6.49/b, -7.67%, 하락)\n\n코멘터리\n주초 미국의 대이란 대규모 공습 계획 취소와 미·이란 협상 재개 기대, OPEC+의 9월 증산 결정이 겹치며 지정학적 위험 프리미엄이 빠르게 축소돼 WTI는 $75.22/b까지 급락했다. 이후 이란·오만의 호르무즈 통항 협상이 진행되면서도 통행 수수료와 미국의 자유통항 요구를 둘러싼 이견, 합의 승인 지연 및 중동 군사 긴장이 재부각돼 주후반 반등했으나 전주 수준을 회복하지 못해 하락으로 마감.\n\n변둉요인\n- 미국의 대이란 대규모 공습 계획 취소\n- 미·이란 협상 재개 및 긴장 완화 기대\n- OPEC+ 9월 원유 증산 결정\n- 미국 원유재고 증가와 수요 둔화 우려\n- 이란·오만 호르무즈 통항 협상 진행\n- 미국의 무상 자유통항 요구와 이란 통행료 요구 충돌\n- 호르무즈 정상화 합의 승인 지연\n- 중동 군사 긴장과 해상 운송 불확실성 지속\n\n결론 및 전망\n주초 급락으로 지정학적 프리미엄 상당 부분이 제거됐지만 호르무즈 통항 방식과 수수료 문제에 대한 미국·이란 간 이견이 남아 단기 변동성은 지속될 전망이다. 협상 진전 시 $74~76/b까지 재조정될 수 있으나 통항 합의 지연이나 군사 충돌 재확대 시 $80/b 이상 반등 가능성이 있다.\n\n추가 정보\n- 7/31: 호르무즈 통과 유조선 공격과 미국의 추가 강경 대응 가능성으로 중동 원유 수송 차질 우려가 재부각되며 $84.67/b로 상승.\n- 8/3: 미국의 대이란 공습 계획 취소와 협상 재개 기대, OPEC+ 9월 증산 결정으로 위험 프리미엄이 급격히 축소되며 $80.34/b로 하락.\n- 8/4: 미·이란 협상 진전과 호르무즈 정상화 기대가 확산되며 지정학적 프리미엄이 추가 축소돼 $75.77/b로 급락.\n- 8/5: 이란·오만의 호르무즈 통항 협의에도 미국의 해상 봉쇄 해제 여부가 불확실하고 원유재고 증가와 수요 둔화 부담이 겹쳐 $75.22/b로 하락.\n- 8/6: 호르무즈 자유통항 합의 승인 지연과 미·이란 군사 긴장 재부각으로 위험 프리미엄이 일부 회복되며 $77.29/b로 상승.\n- 8/7: 호르무즈 통행 수수료와 미국의 자유통항 요구가 충돌하며 완전 정상화 불확실성이 지속돼 $78.18/b로 상승.\n- 주중 흐름 요약: 주초 외교 기대와 OPEC+ 증산 부담으로 $75/b대까지 급락한 뒤 호르무즈 협상 난항으로 이틀 연속 반등했으나 전주 대비 -$6.49/b, -7.67% 하락.\n\n데일리가격\n7/31: $84.67\n8/3: $80.34\n8/4: $75.77\n8/5: $75.22\n8/6: $77.29\n8/7: $78.18\n\n제목 : SM 종목 브리핑 (2026-08-07)\n\n가격\nSM CFR China: $1082.00/mt ← $1107.00/mt (전주 대비 -$25.00/mt, -2.26%, 하락)\n\n코멘터리\n주초에는 미·이란 협상 재개 기대와 호르무즈 통항 정상화 가능성으로 원유·나프타와 중국 SM 선물이 약세를 보이며 가격이 하락했고, 8월 5일에는 Brent 급락과 DCE 선물 급락, ABS·PS 구매 관망까지 겹쳐 $1061/mt까지 밀렸다. 이후 호르무즈 협상 난항으로 국제유가가 반등하고 중국 근월물 공급 타이트 우려와 선물 회복이 하단을 지지했지만 동남아 수요 부진과 높은 재고 부담을 상쇄하지 못해 하락으로 마감.\n\n변둉요인\n- 미·이란 협상 재개와 지정학적 위험 완화\n- 원유 및 나프타 가격 급락\n- 중국 DCE SM 선물 변동성 확대\n- 동중국 항만 SM 재고 부담\n- ABS 및 PS 다운스트림 구매 부진\n- 중국 근월물 공급 타이트 우려\n- 호르무즈 정상통항 협상 난항\n- 동남아 SM 실수요 부진\n\n결론 및 전망\n호르무즈 협상 난항과 중국 근월 공급 타이트가 가격 하단을 지지하겠으나 동중국 재고 부담과 ABS·  const tabs=['전체',...CATEGORY_ORDER]; document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="tab ${t===activeCategory?'active':''}" onclick="activeCategory='${t}';render()">${t}</button>`).join('');
 document.body.classList.toggle('full',mode==='full');
 let out=''; for(const cat of CATEGORY_ORDER){ const arr=ITEMS.filter(x=>x.category===cat&&(activeCategory==='전체'||activeCategory===cat)); if(!arr.length)continue; out+=`<section class="section"><div class="section-title"><h3>${cat}</h3><small>${arr.length}개 품목</small></div><div class="grid-head"><div>품목</div><div>현재가</div><div>전주가</div><div>WoW</div><div>핵심 코멘트</div><div></div></div>`; arr.forEach((x)=>{ const idx=ITEMS.indexOf(x); out+=`<div class="row"><div class="row-main"><div><div class="name">${esc(displayName(x.name))}</div><div class="note">${esc(x.date)}</div></div><div class="pricebox"><div class="price">${esc(x.current_raw||x.current)}</div><div class="benchmark-sub">(${esc(x.benchmark)})</div></div><div class="prev">${esc(x.prev_raw||x.previous)}</div><div class="chg ${cls(x.direction)}">${x.direction}<br>${fmtPct(x.pct)}</div><div class="comm">${esc(x.commentary)}</div><button class="detailbtn" onclick="openDetail(${idx})">상세</button></div><div class="detail-inline"><div class="detailbox"><h4>변동요인</h4><pre>${esc(x.factors)}</pre></div><div class="detailbox"><h4>결론 및 전망</h4><pre>${esc(x.outlook)}</pre></div><div class="detailbox" style="grid-column:1/-1"><h4>추가 정보</h4><pre>${esc(x.additional)}</pre></div></div></div>`; }); out+='</section>'; } document.getElementById('board').innerHTML=out;
}
function setMode(m){mode=m;render()}
function openDetail(i){const x=ITEMS[i];document.getElementById('dTitle').textContent=x.name+' 상세 브리핑';document.getElementById('dMeta').textContent=x.date+' · '+x.benchmark+' · '+x.direction+' '+fmtPct(x.pct);document.getElementById('dPrice').textContent=x.price_line;document.getElementById('dComm').textContent=x.commentary;document.getElementById('dFactors').textContent=x.factors;document.getElementById('dOutlook').textContent=x.outlook;document.getElementById('dAdditional').textContent=x.additional;const daily=(x.daily||[]);document.getElementById('dailyBox').classList.toggle('hidden',!daily.length);document.getElementById('dDaily').textContent=daily.map(r=>r.date+': '+r.value+(r.suffix?' '+r.suffix:'')).join('\n');drawSpark(daily);document.getElementById('detailModal').classList.add('show')} function closeDetail(){document.getElementById('detailModal').classList.remove('show')}
function drawSpark(rows){const svg=document.getElementById('spark');if(!rows.length){svg.innerHTML='';return}const vals=rows.map(r=>r.value),min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||1,w=900,h=160,p=25;const pts=rows.map((r,i)=>{const x=p+i*(w-2*p)/Math.max(rows.length-1,1),y=h-p-(r.value-min)/span*(h-2*p);return [x,y]});svg.innerHTML=`<polyline fill="none" stroke="#ff8c00" stroke-width="4" points="${pts.map(p=>p.join(',')).join(' ')}"/>`+pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#ff8c00"/><text x="${p[0]}" y="${Math.max(15,p[1]-10)}" text-anchor="middle" font-size="12" font-weight="800">${rows[i].value}</text>`).join('')}
function openParser(){document.getElementById('parserModal').classList.add('show')} function closeParser(){document.getElementById('parserModal').classList.remove('show')} function loadSample(){document.getElementById('parserText').value=SAMPLE_TEXT}
function categoryFor(name){if(name==='WTI')return '에너지/매크로';if(['Ethylene','Propylene'].includes(name))return '기초유분';if(['SM','BD','AN','BPA','MMA'].includes(name))return '주요 원료/중간체';if(['ABS','PC','EPS','PS','PBR'].includes(name))return '폴리머/유도품';return '지역 벤치마크'}
function parseBlock(b){const tm=b.match(/^제목\s*:\s*(.+?)\s+종목\s+브리핑\s*\((\d{4}-\d{2}-\d{2})\)/m);if(!tm)return null;const name=tm[1].trim(),date=tm[2];const keys=['가격','코멘터리','변둉요인','변동요인','결론 및 전망','추가 정보','추가정보','데일리가격'];const rg=new RegExp('^('+keys.join('|').replace(/ /g,'\\s*')+')\\s*$','gm');let ms=[...b.matchAll(rg)],sec={};ms.forEach((m,i)=>{let k=m[1].replace(/\s+/g,' ');if(k==='변동요인')k='변둉요인';if(k==='추가정보')k='추가 정보';sec[k]=b.slice(m.index+m[0].length,i+1<ms.length?ms[i+1].index:b.length).trim()});const pl=(sec['가격']||'').split(/\n/)[0].trim();const pm=pl.match(/^(.*?):\s*(.*?)\s*←\s*(.*?)\s*\((.*)\)$/);let benchmark=name,curRaw='',prevRaw='',paren='';if(pm){benchmark=pm[1].trim();curRaw=pm[2].trim();prevRaw=pm[3].trim();paren=pm[4]}const num=s=>{const m=String(s).match(/([+-]?[\d,]+(?:\.\d+)?)/);return m?parseFloat(m[1].replace(/,/g,'')):null};const cur=num(curRaw),prev=num(prevRaw);const pp=[...paren.matchAll(/([+-]?[\d,.]+)\s*%/g)];let pct=pp.length?parseFloat(pp[pp.length-1][1].replace(/,/g,'')):((cur!=null&&prev)?(cur-prev)/prev*100:null);let direction=paren.includes('상승')?'상승':paren.includes('하락')?'하락':'보합';const daily=[];(sec['데일리가격']||'').split(/\n+/).forEach(line=>{const m=line.match(/(\d{1,2}\/\d{1,2})\s*:\s*\$?\s*([\d,.]+)\s*(.*)/);if(m)daily.push({date:m[1],value:parseFloat(m[2].replace(/,/g,'')),suffix:m[3].trim()})});return {name,date,category:categoryFor(name),benchmark,price_line:pl,current_raw:curRaw,prev_raw:prevRaw,current:cur,previous:prev,pct,direction,commentary:sec['코멘터리']||'',factors:sec['변둉요인']||'',outlook:sec['결론 및 전망']||'',additional:sec['추가 정보']||'',daily}}
function parseAndRender(){const t=document.getElementById('parserText').value.trim();if(!t)return alert('브리핑 텍스트를 붙여넣어 주세요.');const bs=t.split(/(?=^제목\s*:)/m).map(x=>x.trim()).filter(Boolean),parsed=bs.map(parseBlock).filter(Boolean);if(!parsed.length)return alert('인식된 품목이 없습니다.');ITEMS=parsed;activeCategory='전체';closeParser();render()}
function copyReport(){let out='[LAM Petrochemical Weekly Board]\n';CATEGORY_ORDER.forEach(c=>{const a=ITEMS.filter(x=>x.category===c);if(!a.length)return;out+='\n['+c+']\n';a.forEach(x=>{out+=x.name+' | '+x.current_raw+' | '+fmtPct(x.pct)+' '+x.direction+'\n- '+x.commentary+'\n'})});navigator.clipboard.writeText(out.trim()).then(()=>alert('카카오톡 공유용 요약이 복사되었습니다.'))}
render();
</script></body></html>
